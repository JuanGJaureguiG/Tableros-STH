<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIMINUTO-DATA STH</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --bg:#F5F6F3;
    --panel:#FFFFFF;
    --ink:#16324F;
    --ink-soft:#3B4B5C;
    --muted:#6B7280;
    --border:#E1E4E1;
    --amber:#E2962B;
    --teal:#2F7A6D;
    --purple:#8A5FBF;
    --clay:#C1432B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink-soft);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-size:14px; line-height:1.5;
    min-height:100vh;
  }
  h1,h2,.eyebrow{font-family:'Space Grotesk', system-ui, sans-serif;}

  .top{
    background:var(--ink); color:#fff;
    padding:44px 40px 56px;
  }
  .top-inner{max-width:1280px; margin:0 auto;}

  .hero-grid{
    display:grid;
    grid-template-columns:240px 1fr;
    gap:36px;
    align-items:center;
  }
  .logo-box{
    border:1px solid rgba(255,255,255,0.3);
    height:100%;
    min-height:180px;
    display:flex; align-items:center; justify-content:center;
    padding:22px;
  }
  .brand-logo{width:100%; height:auto; display:block;}

  .hero-text h1{font-size:28px; font-weight:600; line-height:1.2;}
  .hero-text p{margin-top:10px; color:#A9BBC8; font-size:14px; max-width:520px;}

  .collage{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    grid-template-rows:repeat(2, 78px);
    gap:0;
    line-height:0;
  }
  .collage img{
    width:100%; height:100%;
    object-fit:cover; display:block;
    filter:saturate(1.03);
  }
  .collage .big{grid-column:span 2; grid-row:span 2;}

  .wrap{max-width:1280px; margin:-34px auto 60px; padding:0 40px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:18px;
  }
  @media (max-width:1180px){ .grid{grid-template-columns:repeat(3, 1fr);} }
  @media (max-width:720px){ .grid{grid-template-columns:repeat(2, 1fr);} }
  @media (max-width:980px){ .hero-grid{grid-template-columns:1fr;} }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-top:4px solid var(--accent, var(--amber));
    padding:24px 22px 22px;
    display:flex; flex-direction:column;
    text-decoration:none; color:inherit;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 24px rgba(22,50,79,0.10);
  }
  .card .tag{
    font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:var(--accent, var(--amber)); margin-bottom:10px;
  }
  .card h2{font-size:18px; color:var(--ink); font-weight:600; line-height:1.25; margin-bottom:8px;}
  .card p{font-size:13px; color:var(--muted); flex:1; margin-bottom:18px;}
  .card .go{
    font-size:13px; font-weight:600; color:var(--ink);
    display:flex; align-items:center; gap:6px;
  }
  .card .go .arrow{transition:transform .15s ease;}
  .card:hover .go .arrow{transform:translateX(3px);}

  footer{
    max-width:1280px; margin:0 auto; padding:0 40px 50px;
    font-size:11.5px; color:var(--muted);
  }
</style>
</head>
<body>

  <div class="top">
    <div class="top-inner">
      <div class="hero-grid">
        <div class="logo-box">
          <img src="logo.png" alt="UNIMINUTO Corporación Universitaria Minuto de Dios — Tolima-Huila" class="brand-logo">
        </div>
        <div class="hero-text">
          <h1>UNIMINUTO-DATA STH</h1>
          <p>Todos los tableros institucionales, en un solo lugar.</p>
        </div>
      </div>
      <div class="collage">
        <img src="campus-hero.jpg" alt="Sede Chicalá — UNIMINUTO Tolima-Huila" class="big">
        <img src="campus-1.jpg" alt="Sede Chicalá — zona de descanso">
        <img src="campus-2.jpg" alt="Sede Chicalá — entrada principal">
        <img src="campus-3.jpg" alt="Sede Chicalá — cancha deportiva">
        <img src="campus-4.jpg" alt="Sede Chicalá — senderos y jardines">
        <img src="campus-5.jpg" alt="Sede Chicalá — biblioteca">
        <img src="campus-6.jpg" alt="Sede Chicalá — capilla">
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>

  <footer>Corte de datos: 31 de agosto de 2026 · Los tableros se actualizan de forma independiente entre sí.</footer>

<script>
// Para agregar un tablero nuevo (Graduados, Colaboradores, etc.), solo añade
// un objeto más a esta lista con su título, descripción, color y URL.
const DASHBOARDS = [
  {
    tag: 'Dirección Estratégica',
    title: 'Tablero Dirección Estratégica',
    desc: 'Riesgos estratégicos, PDI, plan de acción y calidad de procesos de la Sede.',
    color: '#5294E2',
    url: 'https://juangjaureguig.github.io/Tablero-direccion-estrategica/'
  },
  {
    tag: 'Matrícula',
    title: 'Histórico de Estudiantes',
    desc: 'Matrícula por sede, programa y periodo, con demografía y evolución histórica (2016-1 a 2026-2).',
    color: '#E2962B',
    url: 'https://juangjaureguig.github.io/Tablero-estudiantes-uniminuto-20161-20262/'
  },
  {
    tag: 'Oferta académica',
    title: 'Oferta Activa 2026-2',
    desc: 'Programas activos por Centro Universitario, Modalidad, Nivel y Sede Dueña.',
    color: '#E84393',
    url: 'https://juangjaureguig.github.io/Oferta_Activa_STH/'
  },
  {
    tag: 'Retención',
    title: 'Ausentismo y Deserción',
    desc: 'Series oficiales por Centro Universitario: evolución histórica y comparativo (2014-1 a 2026-2).',
    color: '#C1432B',
    url: 'https://juangjaureguig.github.io/Ausentismo-Deserci-n-STH/'
  },
  {
    tag: 'Retención · Detalle',
    title: 'Ausentismo y Deserción por Programa',
    desc: 'El mismo análisis, desagregado por programa académico: tabla de detalle y alertas de programas críticos.',
    color: '#8A5FBF',
    url: 'https://juangjaureguig.github.io/Ausentismo-Deserci-n-programas/'
  },
  {
    tag: 'Matrícula',
    title: 'Matrículas 2026-2',
    desc: 'Seguimiento al proceso de matrícula del periodo 2026-2 en la Sede Tolima-Huila.',
    color: '#B08968',
    url: 'https://juangjaureguig.github.io/Tablero_Matriculas/'
  },
  {
    tag: 'Ingresos',
    title: 'Educación Continua',
    desc: 'Ingresos y matrículas de Educación Continua de la Sede, con comparativo por año.',
    color: '#D4A017',
    url: 'https://juangjaureguig.github.io/Tablero_Edu.Continua/'
  },
  {
    tag: 'Contexto regional',
    title: 'Competitividad Territorial',
    desc: 'Indicadores de competitividad de los departamentos de Tolima y Huila — 2025.',
    color: '#2F7A6D',
    url: 'https://juangjaureguig.github.io/competitividad-tolima-huila/'
  },
  {
    tag: 'Egresados',
    title: 'Graduados',
    desc: 'Histórico de graduados de la Sede por Centro Universitario, programa y periodo.',
    color: '#4E8098',
    url: 'https://juangjaureguig.github.io/Graduados_STH/'
  },
  {
    tag: 'Atención al usuario',
    title: 'FPQS · CONECTA',
    desc: 'Felicitaciones, peticiones, quejas y sugerencias registradas en la Sede.',
    color: '#C1432B',
    url: 'https://juangjaureguig.github.io/FPQS_STH/'
  }
];

const grid = document.getElementById('grid');
DASHBOARDS.forEach(d => {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = d.url;
  a.style.setProperty('--accent', d.color);
  a.innerHTML = `
    <div class="tag">${d.tag}</div>
    <h2>${d.title}</h2>
    <p>${d.desc}</p>
    <div class="go">Abrir tablero <span class="arrow">→</span></div>
  `;
  grid.appendChild(a);
});
</script>
</body>
</html>
